<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>売値計算機</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --text: #222;
    --sub: #666;
    --line: #ddd;
    --accent: #2f6f4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", -apple-system, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 420px; margin: 0 auto; }
  h1 {
    font-size: 1.15rem;
    margin: 0 0 4px;
  }
  .lead {
    color: var(--sub);
    font-size: 0.85rem;
    margin: 0 0 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 0.8rem;
    color: var(--sub);
    margin: 0 0 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 4px;
  }
  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  input[type="number"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .unit {
    font-size: 0.75rem;
    color: var(--sub);
    margin-left: 4px;
  }
  .result-main {
    text-align: center;
    padding: 10px 0;
  }
  .result-main .krw {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .result-main .jpy-sub {
    font-size: 0.8rem;
    color: var(--sub);
    margin-top: 4px;
  }
  .rate-status {
    font-size: 0.7rem;
    color: var(--sub);
    margin-top: 10px;
    text-align: center;
  }
  .rate-status.ok { color: var(--accent); }
  .rate-status.err { color: #b34a3c; }
  .rate-manual {
    margin-top: 10px;
    text-align: center;
  }
  .rate-manual input {
    width: 120px;
    display: inline-block;
    text-align: center;
  }
  .note {
    font-size: 0.72rem;
    color: var(--sub);
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>売値計算機</h1>
  <p class="lead">仕入れ値を入れると、送料と手数料を含めた最低売値をウォンで表示します。</p>

  <div class="card">
    <label for="a">仕入れ値(日本円)</label>
    <input type="number" id="a" value="38980" inputmode="numeric">
  </div>

  <div class="card">
    <h2>最低売値</h2>
    <div class="result-main">
      <div class="krw" id="pkrw">-</div>
      <div class="jpy-sub" id="pjpy">-</div>
    </div>
    <div class="rate-status" id="rateStatus">為替レート取得中…</div>
    <div class="rate-manual">
      <input type="number" id="rate" step="0.01" inputmode="decimal">
      <span class="unit">ウォン/円(手動修正可)</span>
    </div>
  </div>

  <p class="note">
    計算式:売値(円) = (仕入れ値 + 1,200円) ÷ (1 − 0.108)<br>
    送料1,200円・手数料10.8%で固定。ウォンは自動取得の為替レートで換算。
  </p>
</div>

<script>
  const $ = id => document.getElementById(id);
  const fmtJPY = n => isFinite(n) ? Math.round(n).toLocaleString('ja-JP') + '円' : '-';
  const fmtKRW = n => isFinite(n) ? Math.round(n).toLocaleString('ko-KR') + 'ウォン' : '-';

  const SHIPPING = 1200;
  const COMMISSION = 0.108;

  function calc() {
    const a = parseFloat($('a').value) || 0;
    const rate = parseFloat($('rate').value) || 0;
    const p = (a + SHIPPING) / (1 - COMMISSION);

    $('pjpy').textContent = '(' + fmtJPY(p) + ')';
    $('pkrw').textContent = rate > 0 ? fmtKRW(p * rate) : '為替レートを入力してください';
  }

  async function fetchRate() {
    const status = $('rateStatus');
    try {
      const res = await fetch('https://open.er-api.com/v6/latest/JPY');
      const data = await res.json();
      const krwRate = data.rates && data.rates.KRW;
      if (!krwRate) throw new Error('KRWレートが見つかりません');
      $('rate').value = krwRate.toFixed(4);
      status.textContent = '自動取得成功(取得日時: ' + (data.time_last_update_utc || '不明') + ')';
      status.className = 'rate-status ok';
    } catch (e) {
      status.textContent = '自動取得に失敗しました。下の欄に手動でレートを入力してください。';
      status.className = 'rate-status err';
    }
    calc();
  }

  ['a', 'rate'].forEach(id => $(id).addEventListener('input', calc));
  fetchRate();
</script>
</body>
</html>
